name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: Cao150702
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#2b8f85&color_dots=#2b2b31,#173a36,#1f5a52,#2e7f74,#5eead4
            dist/github-contribution-grid-snake-dark.svg?color_snake=#5eead4&color_dots=#2b2b31,#173a36,#1f5a52,#2e7f74,#5eead4
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
