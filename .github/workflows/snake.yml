name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: output-branch-push
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake from contributions
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%232b8f85&color_dots=%23f1f1f3,%23d7f5f0,%23a9e7dd,%2347b5a7,%235eead4
            dist/github-contribution-grid-snake-dark.svg?color_snake=%235eead4&color_dots=%232b2b31,%23173a36,%231f5a52,%232e7f74,%235eead4&palette=github-dark

      - name: Patch missing # in CSS color vars
        run: |
          sudo chown -R $USER:$USER dist
          sed -i -E 's/--(cs|ce|c[0-4]):([0-9A-Fa-f]{6})/--\1:#\2/g' dist/*.svg
          echo "=== light preview ==="
          head -c 400 dist/github-contribution-grid-snake.svg
          echo ""
          echo "=== dark preview ==="
          head -c 400 dist/github-contribution-grid-snake-dark.svg

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          keep_files: true
