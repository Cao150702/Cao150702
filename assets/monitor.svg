<svg xmlns="http://www.w3.org/2000/svg" width="760" height="333" viewBox="0 0 760 333" role="img"><title>PortaPack DMR Monitor · 手持 DMR 集群观察 · 在 HackRF / PortaPack 上开发监听插件， 把站点、信道与呼叫活动整理成可读信息。 记录现场活动，回来继续分析。（主题图形，非设备截图）</title><style>.pintu-slide{animation:pintu-slide 8s ease-in-out infinite;transform:translateX(140px)}@keyframes pintu-slide{0%,18%,100%{transform:translateX(0)}55%,80%{transform:translateX(140px)}}.breathe{animation:breathe 5s ease-in-out infinite}.signal{animation:signal 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.piece-a{animation:join-a 7s ease-in-out infinite}.piece-b{animation:join-b 7s ease-in-out infinite}@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}@keyframes signal{0%,100%{transform:scaleY(.75);opacity:.65}50%{transform:scaleY(1);opacity:1}}@keyframes join-a{0%,15%,100%{transform:translate(-4px,-4px)}45%,70%{transform:translate(0,0)}}@keyframes join-b{0%,15%,100%{transform:translate(4px,4px)}45%,70%{transform:translate(0,0)}}@media(prefers-reduced-motion:reduce){.breathe,.signal,.piece-a,.piece-b,.pintu-slide{animation:none}}text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}</style><rect x="1" y="1" width="758" height="331" rx="16" fill="#242429" stroke="#414149"/><rect x="32" y="25" width="38" height="38" rx="9" fill="#24413e" stroke="#414149"/><g transform="translate(51 44)" fill="none" stroke="#5eead4" stroke-width="1.5"><circle r="3"/><path d="M0 3V11M-7-7a10 10 0 0 0 0 14M7-7a10 10 0 0 1 0 14"/></g><text x="82" y="49" font-size="14" font-weight="400" fill="#a1a1aa">手持 DMR 集群观察</text><text x="32" y="103" font-size="28" font-weight="600" fill="#fafafa">PortaPack DMR Monitor</text><text x="32" y="140" font-size="16" font-weight="400" fill="#a1a1aa">在 HackRF / PortaPack 上开发监听插件，</text><text x="32" y="165" font-size="16" font-weight="400" fill="#a1a1aa">把站点、信道与呼叫活动整理成可读信息。</text><text x="32" y="190" font-size="16" font-weight="400" fill="#a1a1aa">记录现场活动，回来继续分析。</text><rect x="32" y="227"