<svg xmlns="http://www.w3.org/2000/svg" width="760" height="296" viewBox="0 0 760 296" role="img"><title>曹天航 · 通信工程在读 · 无线电、软件与摄影</title><style>.pintu-slide{animation:pintu-slide 8s ease-in-out infinite;transform:translateX(140px)}@keyframes pintu-slide{0%,18%,100%{transform:translateX(0)}55%,80%{transform:translateX(140px)}}.breathe{animation:breathe 5s ease-in-out infinite}.signal{animation:signal 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.piece-a{animation:join-a 7s ease-in-out infinite}.piece-b{animation:join-b 7s ease-in-out infinite}@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}@keyframes signal{0%,100%{transform:scaleY(.75);opacity:.65}50%{transform:scaleY(1);opacity:1}}@keyframes join-a{0%,15%,100%{transform:translate(-4px,-4px)}45%,70%{transform:translate(0,0)}}@keyframes join-b{0%,15%,100%{transform:translate(4px,4px)}45%,70%{transform:translate(0,0)}}@media(prefers-reduced-motion:reduce){.breathe,.signal,.piece-a,.piece-b,.pintu-slide{animation:none}}text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}</style><rect x="1" y="1" width="758" height="294" rx="16" fill="#242429" stroke="#414149"/><text x="32" y="43" font-size="14" font-weight="400" fill="#a1a1aa">Cao150702</text><rect x="640" y="25" width="96" height="26" rx="7" fill="#303038" stroke="#484851"/><text x="650" y="43" font-size="12" font-weight="400" fill="#d4d4d8">个人工作台</text><text x="32" y="105" font-size="36" font-weight="600" fill="#fafafa">曹天航</text><text x="32" y="136" font-size="15" font-weight="400" fill="#a1a1aa">Tianhang Cao</text><text x="32" y="180" font-size="17" font-weight="400" fill="#d4d4d8">通信工程在读，喜欢无线电，也写软件。</text><text x="32" y="206" font-size="17" font-weight="400" fill="#d4d4d8">在上海理工大学学习，在酷爱科技实习。</text><rect x="32" y="241" width="66" height="26" rx="7" fill="#303038" stroke="#484851"/><text x="42" y="259" font-size="12" font-weight="400" fill="#d4d4d8">无线电</text><rect x="107" y="241" width="87" height="26" rx="7" fill="#303038" stroke="#484851"/><text x="117" y="259" font-size="12" font-weight="400" fill="#d4d4d8">软件 / AI</text><rect x="203" y="241" width="54" height="26" rx="7" fill="#303038" stroke="#484851"/><text x="213" y="259" font-size="12" font-weight="400" fill="#d4d4d8">摄影</text><g transform="translate(624 113)" fill="none" stroke="#5eead4" stroke-width="1.8" class="breathe"><circle r="6" fill="#d4d4d8"/><path d="M0 7V57M-20 58H20M-18-18a26 26 0 0 0 0 36M18-18a26 26 0 0 1 0 36M-32-32a46 46 0 0 0 0 64M32-32a46 46 0 0 1 0 64"/></g></svg>