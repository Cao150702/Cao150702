<svg xmlns="http://www.w3.org/2000/svg" width="760" height="333" viewBox="0 0 760 333" role="img"><title>树莓派 + MMDVM · DMR Tier III 集群站点实验 · 用小型硬件平台，与真实终端交互。 已有终端登记、业务授权和 单站组呼语音上行记录。（主题图形，非设备截图）</title><style>.pintu-slide{animation:pintu-slide 8s ease-in-out infinite;transform:translateX(140px)}@keyframes pintu-slide{0%,18%,100%{transform:translateX(0)}55%,80%{transform:translateX(140px)}}.breathe{animation:breathe 5s ease-in-out infinite}.signal{animation:signal 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.piece-a{animation:join-a 7s ease-in-out infinite}.piece-b{animation:join-b 7s ease-in-out infinite}@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}@keyframes signal{0%,100%{transform:scaleY(.75);opacity:.65}50%{transform:scaleY(1);opacity:1}}@keyframes join-a{0%,15%,100%{transform:translate(-4px,-4px)}45%,70%{transform:translate(0,0)}}@keyframes join-b{0%,15%,100%{transform:translate(4px,4px)}45%,70%{transform:translate(0,0)}}@media(prefers-reduced-motion:reduce){.breathe,.signal,.piece-a,.piece-b,.pintu-slide{animation:none}}text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}</style><rect x="1" y="1" width="758" height="331" rx="16" fill="#242429" stroke="#414149"/><rect x="32" y="25" width="38" height="38" rx="9" fill="#2a3c53" stroke="#414149"/><g transform="translate(41 34)" fill="none" stroke="#93c5fd" stroke-width="1.5"><rect width="20" height="20" rx="3"/><rect x="6" y="6" width="8" height="8" rx="1"/></g><text x="82" y="49" font-size="14" font-weight="400" fill="#a1a1aa">DMR Tier III 集群站点实验</text><text x="32" y="103" font-size="28" font-weight="600" fill="#fafafa">树莓派 + MMDVM</text><text x="32" y="140" font-size="16" font-weight="400" fill="#a1a1aa">用小型硬件平台，与真实终端交互。</text><text x="32" y="165" font-size="16" font-weight="400" fill="#a1a1aa">已有终端登记、业务授权和</text><text x="32" y="190" font-size="16" font-weight="400" fill="#a1a1aa">单站组呼语音上行记录。</text><rect x="32" y="227" width="66" height="26" rx="7" fill="#30303