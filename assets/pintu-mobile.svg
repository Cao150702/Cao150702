<svg xmlns="http://www.w3.org/2000/svg" width="390" height="333" viewBox="0 0 390 333" role="img"><title>拼途 · Pintu · 找回曾经的那个未来 · 用切割、旋转与拼接， 走过一段几何叙事。（主题图形，非设备截图）</title><style>.pintu-slide{animation:pintu-slide 8s ease-in-out infinite;transform:translateX(140px)}@keyframes pintu-slide{0%,18%,100%{transform:translateX(0)}55%,80%{transform:translateX(140px)}}.breathe{animation:breathe 5s ease-in-out infinite}.signal{animation:signal 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.piece-a{animation:join-a 7s ease-in-out infinite}.piece-b{animation:join-b 7s ease-in-out infinite}@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}@keyframes signal{0%,100%{transform:scaleY(.75);opacity:.65}50%{transform:scaleY(1);opacity:1}}@keyframes join-a{0%,15%,100%{transform:translate(-4px,-4px)}45%,70%{transform:translate(0,0)}}@keyframes join-b{0%,15%,100%{transform:translate(4px,4px)}45%,70%{transform:translate(0,0)}}@media(prefers-reduced-motion:reduce){.breathe,.signal,.piece-a,.piece-b,.pintu-slide{animation:none}}text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}</style><rect x="1" y="1" width="388" height="331" rx="16" fill="#242429" stroke="#414149"/><rect x="24" y="25" width="38" height="38" rx="9" fill="#49382d" stroke="#414149"/><g transform="translate(31 34)" fill="none" stroke="#fdba74" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3H17Q20 3 21 7L23 16Q23 19 20 19L15 15H9L4 19Q1 19 1 16L3 7Q4 3 7 3Z"/><path d="M6 8H12M9 5V11"/><circle cx="17" cy="8" r=".7"/><circle cx="19" cy="11" r=".7"/></g><text x="74" y="49" font-size="14" font-weight="400" fill="#a1a1aa">找回曾经的那个未来</text><text x="24" y="103" font-size="25" font-weight="600" fill="#fafafa">拼途 · Pintu</text><text x="24" y="140" font-size="15" font-weight="400" fill="#a1a1aa">用切割、旋转与拼接，</text><text x="24" y="165" font-size="15" font-weight="400" fill="#a1a1aa">走过一段几何叙事。</text><rect x="24" y="227" width="80" height="26" rx="7" fill="#303038" s